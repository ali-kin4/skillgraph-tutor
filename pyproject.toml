[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillgraph-tutor"
dynamic = ["version"]
description = "Offline-first tutoring engine and learning-analytics dashboard: concept graphs, mastery tracking, spaced repetition and explainable cohort insights."
readme = "README.md"
authors = [{name = "Ali Jabbary"}]
license = {file = "LICENSE"}
requires-python = ">=3.11"
keywords = ["education", "learning-analytics", "spaced-repetition", "mastery", "knowledge-graph", "tutoring"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Education",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.6.0",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/ali-kin4/skillgraph-tutor"
Documentation = "https://github.com/ali-kin4/skillgraph-tutor/tree/main/docs"
Issues = "https://github.com/ali-kin4/skillgraph-tutor/issues"
Changelog = "https://github.com/ali-kin4/skillgraph-tutor/blob/main/CHANGELOG.md"

[project.scripts]
skillgraph = "skillgraph_tutor.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "skillgraph_tutor.__version__"}

[tool.setuptools.package-data]
skillgraph_tutor = ["web/*", "demo_syllabus.md", "py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["skillgraph_tutor"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
