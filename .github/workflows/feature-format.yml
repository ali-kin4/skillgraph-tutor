name: Format SkillGraph upgrade
on:
  push:
    branches: [feat/skillgraph-insights-dashboard]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/skillgraph-insights-dashboard
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install formatter
        run: python -m pip install ruff==0.15.2
      - name: Apply safe lint corrections and formatting
        run: |
          ruff check --fix . || true
          ruff format .
      - name: Commit formatting on feature branch only
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'SkillGraph CI Formatter'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m "style: apply Ruff formatting to SkillGraph upgrade"
          git push origin HEAD:feat/skillgraph-insights-dashboard
