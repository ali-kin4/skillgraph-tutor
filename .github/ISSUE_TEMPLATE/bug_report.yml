name: Bug report
description: Something in the engine, CLI or dashboard does not behave as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do **not** paste real learner names or records; reproduce with `skillgraph dashboard --demo` where possible.
        Security issues belong in a private advisory, see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. skillgraph dashboard --demo
        2. Open Insights and choose scope "Engineering"
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Dashboard UI, Dashboard API, CLI, Mastery / scheduling engine, Packaging / install, Documentation]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `python -c "import skillgraph_tutor; print(skillgraph_tutor.__version__)"`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and browser if the issue is in the dashboard.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
